services:
  postgres:
    image: postgres:16-alpine
    container_name: docai-postgres
    environment:
      POSTGRES_DB: docai
      POSTGRES_USER: docai
      POSTGRES_PASSWORD: docai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: docai-api
    env_file:
      - .env
    ports:
      - "8000:7860"
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./storage:/app/storage

  worker:
    build: .
    container_name: docai-worker
    env_file:
      - .env
    command: python -m app.workers.ingestion_worker
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data: